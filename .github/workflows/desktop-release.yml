# Builds, signs and publishes the desktop app when you push a tag like v0.2.0.
# Installers land on the GitHub Release; stable-named copies make permanent links.
# Optional: sync the same files to Cloudflare R2 (see docs/cloudflare-downloads.md).
# Website CDN URLs (after R2 + custom domain):
#   https://cdn.interviewveil.com/v1/InterviewVeil-mac.dmg
#   https://cdn.interviewveil.com/v1/InterviewVeil-windows-setup.exe
#
# macOS notarization is performed in its own step ("Notarize + staple macOS")
# with an explicit, bounded wait, retry, and stapling. tauri-action only signs;
# it does NOT notarize (we withhold APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID from it).
# This avoids the old failure mode where tauri-action's inline `notarytool --wait`
# blocked with no timeout until GitHub cancelled the 6-hour job
# ("Error: The operation was canceled").
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.1.0) — creates GitHub Release + uploads to R2
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    # Fail clearly instead of hanging toward GitHub's 6-hour job cap.
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
      NO_UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Decides signing/notarization from repo vars AND whether the Apple secrets
      # are actually present, so we fail fast with a clear message instead of a
      # cryptic notary error later.
      - name: Release signing flags
        id: release_flags
        shell: bash
        env:
          A_ID: ${{ secrets.APPLE_ID }}
          A_PW: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mac_sign=false
          if [ "${{ matrix.platform }}" = "macos-latest" ] && [ "${{ vars.MACOS_CODE_SIGNING }}" = "true" ]; then
            mac_sign=true
          fi
          updater_sign=false
          if [ "${{ vars.TAURI_UPDATER_SIGNING }}" = "true" ]; then
            updater_sign=true
          fi
          # Notarize only when signing is on AND all three notary credentials exist.
          mac_notarize=false
          if [ "$mac_sign" = "true" ] && [ -n "$A_ID" ] && [ -n "$A_PW" ] && [ -n "$A_TEAM" ]; then
            mac_notarize=true
          fi
          echo "mac_sign=$mac_sign" >> "$GITHUB_OUTPUT"
          echo "updater_sign=$updater_sign" >> "$GITHUB_OUTPUT"
          echo "mac_notarize=$mac_notarize" >> "$GITHUB_OUTPUT"

          if [ "$mac_sign" = "true" ]; then
            echo "macOS: Apple codesign (MACOS_CODE_SIGNING=true)"
            if [ "$mac_notarize" = "true" ]; then
              echo "macOS: notarization will run in its own step (explicit wait + retry + staple)"
            else
              echo "::warning::MACOS_CODE_SIGNING=true but APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets are missing. The .dmg will be signed but NOT notarized — Gatekeeper will block it. Set the missing secrets."
            fi
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "macOS: unsigned build (--no-sign, no APPLE_* env)"
          fi
          if [ "$updater_sign" = "true" ]; then
            echo "Tauri updater signing enabled (TAURI_UPDATER_SIGNING=true)"
          else
            echo "Tauri updater artifacts disabled (installer-only release)"
          fi

      - name: macOS signed tauri args
        if: matrix.platform == 'macos-latest' && steps.release_flags.outputs.mac_sign == 'true'
        id: mac_signed_args
        shell: bash
        env:
          NO_UPDATER_CONFIG: ${{ env.NO_UPDATER_CONFIG }}
        run: |
          args="--target universal-apple-darwin"
          if [ "${{ steps.release_flags.outputs.updater_sign }}" != "true" ]; then
            args="$args --config $NO_UPDATER_CONFIG"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # tauri-action forwards APPLE_* even when empty, which triggers keychain import
      # failures. It also notarizes inline when APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID
      # are set — so we deliberately withhold those here and notarize in the dedicated
      # step below, where the wait is explicit, bounded and retryable.
      - name: Build release (macOS signed)
        if: matrix.platform == 'macos-latest' && steps.release_flags.outputs.mac_sign == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.release_flags.outputs.updater_sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.release_flags.outputs.updater_sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: InterviewVeil ${{ env.RELEASE_TAG }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          includeUpdaterJson: ${{ steps.release_flags.outputs.updater_sign == 'true' }}
          args: ${{ steps.mac_signed_args.outputs.args }}

      # Explicit notarization: submit once, keep the submission id, wait with a
      # per-attempt cap and retries (re-waiting the SAME submission, never blindly
      # re-uploading), then staple the ticket into the .dmg. A wait timeout stops
      # this client only — Apple keeps processing — so retrying the wait is correct.
      - name: Notarize + staple macOS
        if: matrix.platform == 'macos-latest' && steps.release_flags.outputs.mac_notarize == 'true'
        timeout-minutes: 90
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_WAIT: ${{ vars.MACOS_NOTARIZATION_SKIP_WAIT }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "${DMG:-}" ] || [ ! -f "$DMG" ]; then
            echo "::error::No macOS .dmg found under src-tauri/target/.../bundle/dmg to notarize."
            exit 1
          fi
          echo "Notarizing: $DMG"
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")

          # Escape hatch for a pathologically slow FIRST submission: submit only,
          # don't wait, don't staple. Unset the var for a normal (stapled) release.
          if [ "$SKIP_WAIT" = "true" ]; then
            echo "::warning::MACOS_NOTARIZATION_SKIP_WAIT=true — submitting WITHOUT waiting or stapling. Gatekeeper may still block the .dmg until Apple finishes. Unset this for a normal release."
            xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 3m || true
            echo "Submitted. Track status in App Store Connect → notary history, then re-run without SKIP_WAIT to staple."
            exit 0
          fi

          # Submit ONCE and keep the id so retries wait on the same submission.
          SUBMIT_JSON=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --output-format json)
          echo "$SUBMIT_JSON"
          SID=$(echo "$SUBMIT_JSON" | jq -r '.id')
          if [ -z "$SID" ] || [ "$SID" = "null" ]; then
            echo "::error::notarytool submit returned no submission id."
            exit 1
          fi
          echo "Submission id: $SID"

          # Bounded wait with retries. Apple reports most notarizations finish in
          # minutes; first submissions for a new Developer ID can take longer.
          for attempt in 1 2 3; do
            echo "Waiting for notarization (attempt $attempt/3, 40m cap each)..."
            if xcrun notarytool wait "$SID" "${AUTH[@]}" --timeout 40m; then
              break
            fi
            echo "Wait attempt $attempt did not reach a terminal state; current status:"
            xcrun notarytool info "$SID" "${AUTH[@]}" || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done

          STATUS=$(xcrun notarytool info "$SID" "${AUTH[@]}" --output-format json | jq -r '.status')
          echo "Final notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::warning::Fetching notary log for diagnostics..."
            xcrun notarytool log "$SID" "${AUTH[@]}" "$RUNNER_TEMP/notary-log.json" || true
            cat "$RUNNER_TEMP/notary-log.json" 2>/dev/null || true
            echo "::error::Notarization did not reach Accepted (status=$STATUS)."
            exit 1
          fi

          echo "Stapling notarization ticket into $DMG ..."
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Notarized + stapled: $DMG"

      - name: Build release (Windows + updater signing)
        if: matrix.platform == 'windows-latest' && steps.release_flags.outputs.updater_sign == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: InterviewVeil ${{ env.RELEASE_TAG }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build release (unsigned / no updater signing)
        if: (matrix.platform == 'macos-latest' && steps.release_flags.outputs.mac_sign != 'true') || (matrix.platform == 'windows-latest' && steps.release_flags.outputs.updater_sign != 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: InterviewVeil ${{ env.RELEASE_TAG }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          includeUpdaterJson: false
          args: ${{ matrix.platform == 'macos-latest' && format('{0} --no-sign --config {1}', matrix.args, env.NO_UPDATER_CONFIG) || format('--config {0}', env.NO_UPDATER_CONFIG) }}

      - name: Upload stable-named installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            src=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
            dest=InterviewVeil-mac.dmg
          else
            src=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
            dest=InterviewVeil-windows-setup.exe
          fi
          cp "$src" "$dest"
          gh release upload "${RELEASE_TAG}" "$dest" --clobber

      - name: Publish installer to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_DOWNLOAD_PREFIX }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured on repo ${{ github.repository }} — need secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID and variable R2_BUCKET."
            echo "Secrets only apply to new workflow runs after you save them. Use Actions → R2 smoke test to verify."
            exit 0
          fi
          echo "Uploading installer to s3://${R2_BUCKET}/${R2_PREFIX:-v1}/ ..."
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            file=InterviewVeil-mac.dmg
          else
            file=InterviewVeil-windows-setup.exe
          fi
          prefix="${R2_PREFIX:-v1}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$file" "s3://${R2_BUCKET}/${prefix}/${file}" \
            --endpoint-url "$endpoint" \
            --content-type "application/octet-stream" \
            --content-disposition "attachment; filename=\"${file}\"" \
            --cache-control "public, max-age=3600"
