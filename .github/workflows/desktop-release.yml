# Builds, signs and publishes the desktop app when you push a tag like v0.2.0.
# Installers land on the GitHub Release; stable-named copies make permanent links.
# Optional: sync the same files to Cloudflare R2 (see docs/cloudflare-downloads.md).
# Website CDN URLs (after R2 + custom domain):
#   https://cdn.interviewveil.com/v1/InterviewVeil-mac.dmg
#   https://cdn.interviewveil.com/v1/InterviewVeil-windows-setup.exe
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.1.0) — creates GitHub Release + uploads to R2
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Apple signing is opt-in (repo variable MACOS_CODE_SIGNING=true). Otherwise macOS builds
      # unsigned — fine for R2 / beta; Gatekeeper will warn until you enable signing.
      - name: macOS signing mode
        if: matrix.platform == 'macos-latest'
        run: |
          if [ "${{ vars.MACOS_CODE_SIGNING }}" = "true" ]; then
            echo "MACOS_CODE_SIGNING=true — importing APPLE_* secrets for codesign + notarization"
          else
            echo "MACOS_CODE_SIGNING is not true — building unsigned macOS bundle (no keychain import)"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.MACOS_CODE_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: InterviewVeil ${{ env.RELEASE_TAG }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload stable-named installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            src=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
            dest=InterviewVeil-mac.dmg
          else
            src=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
            dest=InterviewVeil-windows-setup.exe
          fi
          cp "$src" "$dest"
          gh release upload "${RELEASE_TAG}" "$dest" --clobber

      - name: Publish installer to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_DOWNLOAD_PREFIX }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured on repo ${{ github.repository }} — need secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID and variable R2_BUCKET."
            echo "Secrets only apply to new workflow runs after you save them. Use Actions → R2 smoke test to verify."
            exit 0
          fi
          echo "Uploading installer to s3://${R2_BUCKET}/${R2_PREFIX:-v1}/ ..."
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            file=InterviewVeil-mac.dmg
          else
            file=InterviewVeil-windows-setup.exe
          fi
          prefix="${R2_PREFIX:-v1}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$file" "s3://${R2_BUCKET}/${prefix}/${file}" \
            --endpoint-url "$endpoint" \
            --content-type "application/octet-stream" \
            --content-disposition "attachment; filename=\"${file}\"" \
            --cache-control "public, max-age=3600"
