# Manual check: confirms repository secrets/variables reach Actions (no full desktop build).
# GitHub → Actions → "R2 smoke test" → Run workflow.
name: R2 smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2:
    runs-on: ubuntu-latest
    steps:
      - name: Report configuration (no secret values)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_DOWNLOAD_PREFIX }}
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          test -n "$AWS_ACCESS_KEY_ID" && echo "OK  secret R2_ACCESS_KEY_ID" || echo "MISSING secret R2_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY" && echo "OK  secret R2_SECRET_ACCESS_KEY" || echo "MISSING secret R2_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID" && echo "OK  secret R2_ACCOUNT_ID" || echo "MISSING secret R2_ACCOUNT_ID"
          test -n "$R2_BUCKET" && echo "OK  variable R2_BUCKET=$R2_BUCKET" || echo "MISSING variable R2_BUCKET"
          echo "variable R2_DOWNLOAD_PREFIX=${R2_PREFIX:-<empty, will default to v1>}"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::Add secrets/variables on THIS repo (${{ github.repository }}), then re-run."
            exit 1
          fi

      - name: List bucket prefix (AWS CLI)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_DOWNLOAD_PREFIX }}
        run: |
          prefix="${R2_PREFIX:-v1}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 ls "s3://${R2_BUCKET}/${prefix}/" --endpoint-url "$endpoint" || true
          echo "If listing works, R2 credentials are wired correctly for Actions."
